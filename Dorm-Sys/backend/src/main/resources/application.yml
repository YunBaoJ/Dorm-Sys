spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dormitory?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
      encoding: utf-8
  
jwt:
  secret: ${JWT_SECRET:dormitory-demo-secret-key-2026-is-here!}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto # 主键自增

server:
  port: ${PORT:8088}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dormitory?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      continue-on-error: false
      schema-locations: classpath:schema.sql
      encoding: utf-8
  
jwt:
  secret: ${JWT_SECRET:dormitory-demo-secret-key-2026-is-here!}

ai:
  enabled: ${AI_ENABLED:true}
  api-key: ${AI_API_KEY:your_siliconflow_api_key_here}
  base-url: ${AI_BASE_URL:https://api.siliconflow.cn/v1}
  model: ${AI_MODEL:Qwen/Qwen2.5-7B-Instruct}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto # 主键自增

server:
  port: ${PORT:8088}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
